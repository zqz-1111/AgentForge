apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-template
  labels:
    app: ai-agent-template
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-agent-template
  template:
    metadata:
      labels:
        app: ai-agent-template
    spec:
      containers:
        - name: app
          image: ai-agent-template:latest
          ports:
            - containerPort: 8085
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-agent-secrets
                  key: openai-api-key
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ai-agent-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-agent-secrets
                  key: db-password
            - name: REDIS_HOST
              value: "redis-service"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/agentdb"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 40
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-template-service
spec:
  selector:
    app: ai-agent-template
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8085
  type: LoadBalancer
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-secrets
type: Opaque
stringData:
  openai-api-key: "<OPENAI_API_KEY>"
  db-username: "<DB_USERNAME>"
  db-password: "<DB_PASSWORD>"
