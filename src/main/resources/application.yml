spring:
  application:
    name: ai-agent-template

  datasource:
    url: jdbc:postgresql://localhost:5432/agentdb
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  redis:
    host: ${REDIS_HOST:localhost}
    port: 6379
    timeout: 2000ms

server:
  port: 8085

# LLM / AI Configuration
ai:
  openai:
    api-key: ${OPENAI_API_KEY}
    base-url: ${OPENAI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model-name: qwen3.7-max
    temperature: 0.2
    max-tokens: 2048
    timeout-seconds: 30
  model-router:
    provider: CLOUD                # CLOUD or OLLAMA
    simple-model: qwen3.7-flash   # low-complexity queries
    complex-model: qwen3.7-max    # reasoning / multi-step queries
  ollama:
    base-url: http://localhost:11434
    model: qwen2
  rag:
    chunk-size: 500
    chunk-overlap: 50
    top-k: 5
  memory:
    ttl-minutes: 60
    max-messages: 20
  guardrails:
    max-input-length: 2000
    max-output-length: 5000
  agent:
    max-iterations: 5

# Observability
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,info
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    com.aiagent: DEBUG
